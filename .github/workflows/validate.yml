name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate workflow
        run: |
          python -m py_compile scripts/validate_workflow.py
          python scripts/validate_workflow.py examples/generic-panel-study
          grep -q 'triggers:' SKILL.md
          grep -q 'dependencies:' SKILL.md
